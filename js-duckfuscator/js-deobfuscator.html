<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Duckfuscator</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --canvas:#e8edf4; --panel:#ffffff; --panel2:#f2f5f9;
    --border:#d2dae4; --border2:#e3e9f0;
    --fg:#0b0e14; --muted:#3f4854; --faint:#6b7684;
    --accent:#1352cc; --accent-dk:#0b3fa3; --violet:#6d28d9;
    --amber:#b45309; --green:#0f7b3d; --err:#b3121f;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
    --shadow-lift:0 2px 6px rgba(16,24,40,.10), 0 1px 2px rgba(16,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--fg);
       font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;
       display:flex;flex-direction:column}
  ::selection{background:#cfe1ff}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---- header ---- */
  header{padding:10px 14px;background:linear-gradient(180deg,#fff,#f7f9fc);
         border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:2;
         display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
  header::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
                 background:linear-gradient(90deg,var(--accent),var(--violet) 45%,#0891b2 72%,#f5b301)}
  h1{font-size:15px;margin:0 10px 0 0;font-weight:650;letter-spacing:.01em;
     display:flex;align-items:center;gap:8px}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
        border-radius:6px;background:linear-gradient(140deg,var(--accent),var(--violet));
        color:#fff;font:600 11px/1 var(--mono);overflow:hidden;flex:none;
        box-shadow:0 1px 3px rgba(19,82,204,.35)}
  /* when a custom icon file is present it takes over the mark */
  .mark img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;
        transform:scale(1.12);display:none}
  .mark.has-img{background:#1c2027;border-radius:50%;
        box-shadow:0 0 0 1px #fff, 0 0 0 2px rgba(19,82,204,.28), 0 1px 4px rgba(16,24,40,.20);
        transition:transform .18s, box-shadow .18s}
  .mark.has-img:hover{transform:translateY(-1px) rotate(-4deg);
        box-shadow:0 0 0 1px #fff, 0 0 0 2px rgba(109,40,217,.40), 0 3px 8px rgba(16,24,40,.26)}
  .mark.has-img img{display:block}
  .mark.has-img b{display:none}
  /* one continuous gradient across the whole wordmark, so "JS" and "Duckfuscator"
     read as a single lockup; weight and tracking carry the hierarchy instead of color */
  h1 .word{background:linear-gradient(95deg,var(--accent) 5%,var(--violet) 65%);
          -webkit-background-clip:text;background-clip:text;color:transparent;
          font-weight:650}
  h1 .word i{font-style:normal;font-weight:600;letter-spacing:.09em;font-size:.92em;
          padding-right:2px}
  .spacer{flex:1}

  /* ---- buttons ---- */
  button{background:#fff;color:var(--fg);border:1px solid var(--border);
         padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;
         box-shadow:var(--shadow);transition:transform .08s,box-shadow .12s,border-color .12s,color .12s}
  button:hover{border-color:#9db4d8;color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  button:active{transform:translateY(0);box-shadow:var(--shadow)}
  button.primary{background:linear-gradient(180deg,#2f6fe0,var(--accent));color:#fff;
                 border-color:var(--accent-dk);font-weight:600;
                 box-shadow:0 1px 2px rgba(11,63,163,.35),0 2px 6px rgba(11,63,163,.20)}
  button.primary:hover{color:#fff;border-color:var(--accent-dk);filter:brightness(1.07);
                 box-shadow:0 2px 8px rgba(11,63,163,.32),0 1px 2px rgba(11,63,163,.30)}
  #btnClear:hover{border-color:#e6a4a9;color:var(--err)}

  /* ---- options ---- */
  .opts{padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--border);
        display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
        background:#fff;border:1px solid var(--border2);border-radius:999px;padding:3px 11px 3px 8px;
        transition:border-color .12s,background .12s,color .12s}
  .opts label:hover{border-color:#9db4d8}
  .opts label:has(input:checked){background:#eaf1fe;border-color:#b3ccf7;color:var(--accent-dk);font-weight:500}
  .opts input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0}
  select{background:#fff;color:var(--fg);border:1px solid var(--border2);
         border-radius:999px;padding:2px 8px;font-size:12.5px;cursor:pointer}

  /* ---- panes ---- */
  main{flex:1;display:flex;flex-direction:row;min-height:0;padding:10px;background:var(--canvas)}
  .pane{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;
        flex:1 1 0;overflow:hidden;border:1px solid var(--border);border-radius:10px;
        box-shadow:var(--shadow)}
  .pane-head{padding:7px 12px;background:linear-gradient(180deg,#fbfcfe,#f2f5f9);
             border-bottom:1px solid var(--border2);
             font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;
             text-transform:uppercase;display:flex;gap:8px;align-items:center;flex:none}
  .pane-head::before{content:'';width:8px;height:8px;border-radius:50%;flex:none;
             background:var(--dot,var(--faint));box-shadow:0 0 0 2px rgba(0,0,0,.04)}
  #paneIn{--dot:var(--amber)}
  #paneOut{--dot:var(--green)}
  .pane-head .tag{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:500;
             letter-spacing:0;text-transform:none;color:var(--faint)}

  /* ---- draggable divider ---- */
  #split{flex:0 0 12px;background:transparent;cursor:col-resize;position:relative;
         display:flex;align-items:center;justify-content:center;touch-action:none}
  #split::before{content:'';width:4px;height:36px;background:var(--border);border-radius:3px;
         transition:background .12s,height .12s}
  #split:hover::before,#split:focus-visible::before{background:var(--accent);height:52px}
  body.dragging{cursor:col-resize;user-select:none}
  body.dragging.vert{cursor:row-resize}

  /* ---- code areas ---- */
  textarea,pre{flex:1;margin:0;border:0;outline:0;background:var(--bg);color:var(--fg);
       font-family:var(--mono);font-size:13px;line-height:1.6;padding:12px;
       overflow:auto;white-space:pre;tab-size:4;border-radius:0 0 9px 9px}
  textarea{resize:none}
  textarea::placeholder{color:#98a3b3}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:#c3cedb;border-radius:8px;border:3px solid #fff}
  ::-webkit-scrollbar-thumb:hover{background:#a7b6c8}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---- status bar ---- */
  #status{padding:7px 14px;border-top:1px solid var(--border);background:#fff;
          font-size:12px;color:var(--muted);font-family:var(--mono);min-height:30px;
          display:flex;align-items:center;gap:8px}
  #status::before{content:'';width:7px;height:7px;border-radius:50%;flex:none;background:#9aa5b4}
  #status.err{color:var(--err)}
  #status.err::before{background:var(--err);box-shadow:0 0 0 3px rgba(179,18,31,.14)}
  #status.ok{color:var(--green)}
  #status.ok::before{background:var(--green);box-shadow:0 0 0 3px rgba(15,123,61,.14)}

  /* ---- syntax ---- */
  .kw{color:#a4111f}.str{color:#0a4a8f}.num{color:#04407e}.com{color:#68727f;font-style:italic}
  .fn{color:#5b21b6}.op{color:#3a4451}.re{color:#0b6a30}

  @media(max-width:900px){
    header{gap:6px}
    .spacer{display:none}
    button{padding:6px 10px}
    main{flex-direction:column}
    #split{flex:0 0 12px;cursor:row-resize}
    #split::before{width:36px;height:4px}
    #split:hover::before,#split:focus-visible::before{width:52px;height:4px}
  }
</style>
</head>
<body>
<header>
  <h1><span class="mark" id="mark" title="Drop an image here to use your own icon"><img id="logo" alt=""><b>&#129414;</b></span><span class="word"><i>JS</i> Duckfuscator</span></h1>
  <button class="primary" id="btnRun">Deobfuscate &#9654;</button>
  <button id="btnSample">Load sample</button>
  <button id="btnOpen">Open file&hellip;</button>
  <input type="file" id="file" accept=".js,.txt,.html,.json" hidden>
  <div class="spacer"></div>
  <button id="btnCopy">Copy output</button>
  <button id="btnSave">Download .js</button>
  <button id="btnClear">Clear</button>
</header>

<div class="opts">
  <label><input type="checkbox" id="optPack" checked> Unpack eval / P.A.C.K.E.R. (recursive)</label>
  <label><input type="checkbox" id="optEsc" checked> Decode \x \u octal escapes</label>
  <label><input type="checkbox" id="optCharCode" checked> String.fromCharCode &rarr; text</label>
  <label><input type="checkbox" id="optConcat" checked> Fold string concatenation</label>
  <label><input type="checkbox" id="optDot" checked> a["b"] &rarr; a.b</label>
  <label><input type="checkbox" id="optBeautify" checked> Beautify</label>
  <label>Indent <select id="optIndent">
    <option value="2">2 spaces</option>
    <option value="4" selected>4 spaces</option>
    <option value="tab">tab</option>
  </select></label>
  <label><input type="checkbox" id="optHl" checked> Syntax highlight</label>
</div>

<main>
  <div class="pane" id="paneIn">
    <div class="pane-head">Obfuscated input <span class="tag" id="inStats"></span></div>
    <textarea id="input" spellcheck="false" placeholder="Paste obfuscated JavaScript here, then Ctrl+Enter."></textarea>
  </div>
  <div id="split" title="Drag to resize &mdash; double-click to reset to 50/50"></div>

  <div class="pane" id="paneOut">
    <div class="pane-head">Deobfuscated output <span class="tag" id="outStats"></span></div>
    <pre id="output"><code></code></pre>
  </div>
</main>
<div id="status">Ready.</div>

<script>
//---CORE-START---
/* ------------------------------------------------------------------ *
 * Tokenizer
 * ------------------------------------------------------------------ */
var KEYWORDS = new Set(['await','break','case','catch','class','const','continue','debugger',
'default','delete','do','else','enum','export','extends','finally','for','function','if',
'implements','import','in','instanceof','interface','let','new','package','private',
'protected','public','return','static','super','switch','this','throw','try','typeof',
'var','void','while','with','yield','null','true','false']);

/* keywords after which "/" starts a regex and "+/-" are unary */
var PREFIX_KEYWORDS = new Set(['return','typeof','instanceof','in','of','new','delete','void',
'throw','case','do','else','yield','await']);

var PUNCT = ['>>>=','...','===','!==','**=','<<=','>>=','>>>','&&=','||=','??=','=>','==','!=',
'<=','>=','&&','||','??','?.','++','--','+=','-=','*=','/=','%=','&=','|=','^=','**','<<','>>',
'{','}','(',')','[',']',';',',','<','>','+','-','*','/','%','&','|','^','!','~','?',':','=','.','#'];

function isIdStart(c){ return /[A-Za-z_$]/.test(c) || c.charCodeAt(0) > 127; }
function isIdPart(c){ return /[A-Za-z0-9_$]/.test(c) || c.charCodeAt(0) > 127; }

function tokenize(src){
  var toks = [], i = 0, n = src.length, prev = null;

  function regexAllowed(){
    if (!prev) return true;
    if (prev.type === 'num' || prev.type === 'str' || prev.type === 'template' || prev.type === 'regex') return false;
    if (prev.type === 'name') return KEYWORDS.has(prev.value) &&
      ['this','super','true','false','null'].indexOf(prev.value) === -1;
    if (prev.type === 'punct') return [')',']','}','++','--'].indexOf(prev.value) === -1;
    return true;
  }

  function readTemplate(start){
    var j = start + 1, depth = 0;
    while (j < n){
      var c = src[j];
      if (c === '\\'){ j += 2; continue; }
      if (c === '`' && depth === 0){ j++; break; }
      if (c === '$' && src[j+1] === '{'){ depth++; j += 2; continue; }
      if (c === '}' && depth > 0){ depth--; j++; continue; }
      if (c === '`' && depth > 0){ j = readTemplate(j); continue; }
      j++;
    }
    return j;
  }

  while (i < n){
    var c = src[i], start = i;

    if (/\s/.test(c)){
      while (i < n && /\s/.test(src[i])) i++;
      toks.push({type:'ws', value:src.slice(start,i)});
      continue;
    }
    if (c === '/' && src[i+1] === '/'){
      while (i < n && src[i] !== '\n') i++;
      toks.push(prev = {type:'comment', value:src.slice(start,i), line:true});
      continue;
    }
    if (c === '/' && src[i+1] === '*'){
      i += 2;
      while (i < n && !(src[i] === '*' && src[i+1] === '/')) i++;
      i = Math.min(i + 2, n);
      toks.push(prev = {type:'comment', value:src.slice(start,i), line:false});
      continue;
    }
    if (c === '"' || c === "'"){
      var q = c; i++;
      while (i < n){
        if (src[i] === '\\'){ i += 2; continue; }
        if (src[i] === q){ i++; break; }
        if (src[i] === '\n') break;
        i++;
      }
      toks.push(prev = {type:'str', value:src.slice(start,i)});
      continue;
    }
    if (c === '`'){
      i = readTemplate(i);
      toks.push(prev = {type:'template', value:src.slice(start,i)});
      continue;
    }
    if (c === '/' && regexAllowed()){
      var j = i + 1, inClass = false, ok = false;
      while (j < n){
        var d = src[j];
        if (d === '\\'){ j += 2; continue; }
        if (d === '\n') break;
        if (d === '[') inClass = true;
        else if (d === ']') inClass = false;
        else if (d === '/' && !inClass){ j++; ok = true; break; }
        j++;
      }
      if (ok){
        while (j < n && /[a-z]/.test(src[j] || '')) j++;
        i = j;
        toks.push(prev = {type:'regex', value:src.slice(start,i)});
        continue;
      }
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))){
      var m = /^(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*)?\.?\d[\d_]*(?:[eE][+-]?\d+)?)n?/.exec(src.slice(i));
      i += m ? m[0].length : 1;
      toks.push(prev = {type:'num', value:src.slice(start,i)});
      continue;
    }
    if (isIdStart(c)){
      while (i < n && isIdPart(src[i])) i++;
      toks.push(prev = {type:'name', value:src.slice(start,i)});
      continue;
    }
    var hit = null;
    for (var p = 0; p < PUNCT.length; p++){
      if (src.lastIndexOf(PUNCT[p], i) === i){ hit = PUNCT[p]; break; }
    }
    if (hit){ i += hit.length; toks.push(prev = {type:'punct', value:hit}); continue; }
    i++;
    toks.push(prev = {type:'punct', value:c});
  }
  return toks;
}

/* ------------------------------------------------------------------ *
 * String literal helpers
 * ------------------------------------------------------------------ */
function parseStringLiteral(raw){
  var q = raw[0];
  var body = (raw.length > 1 && raw[raw.length-1] === q) ? raw.slice(1,-1) : raw.slice(1);
  var out = '';
  for (var i = 0; i < body.length; i++){
    var c = body[i];
    if (c !== '\\'){ out += c; continue; }
    var e = body[++i];
    if (e === 'n'){ out += '\n'; }
    else if (e === 't'){ out += '\t'; }
    else if (e === 'r'){ out += '\r'; }
    else if (e === 'b'){ out += '\b'; }
    else if (e === 'f'){ out += '\f'; }
    else if (e === 'v'){ out += '\v'; }
    else if (e === 'x'){ out += String.fromCharCode(parseInt(body.substr(i+1,2),16)); i += 2; }
    else if (e === 'u'){
      if (body[i+1] === '{'){
        var end = body.indexOf('}', i);
        out += String.fromCodePoint(parseInt(body.slice(i+2,end),16));
        i = end;
      } else { out += String.fromCharCode(parseInt(body.substr(i+1,4),16)); i += 4; }
    }
    else if (/[0-7]/.test(e)){
      var oct = e;
      while (oct.length < 3 && /[0-7]/.test(body[i+1] || '')) oct += body[++i];
      out += String.fromCharCode(parseInt(oct, 8));
    }
    else if (e === '\n'){ /* line continuation */ }
    else out += e;
  }
  return out;
}

function quote(value, preferred){
  var q = preferred || "'";
  if (value.indexOf(q) !== -1 && value.indexOf(q === "'" ? '"' : "'") === -1) q = (q === "'" ? '"' : "'");
  var out = q;
  for (var i = 0; i < value.length; i++){
    var c = value[i], code = value.charCodeAt(i);
    if (c === '\\' || c === q) out += '\\' + c;
    else if (c === '\n') out += '\\n';
    else if (c === '\r') out += '\\r';
    else if (c === '\t') out += '\\t';
    else if (code < 0x20 || code === 0x7f){
      var h = code.toString(16); if (h.length < 2) h = '0' + h;
      out += '\\x' + h;
    }
    else out += c;
  }
  return out + q;
}

/* ------------------------------------------------------------------ *
 * Stage 1: unpack eval(function(p,a,c,k,e,d){...}(...)) - Dean Edwards packer
 * ------------------------------------------------------------------ */
var PACKER_SIG = /^\s*function\s*\(\s*\w+\s*,\s*\w+\s*,\s*\w+\s*,\s*\w+\s*,\s*\w+\s*(?:,\s*\w+\s*)?\)/;

function findEvalCall(src){
  var toks = tokenize(src), pos = 0;
  for (var a = 0; a < toks.length; a++){ toks[a].start = pos; pos += toks[a].value.length; toks[a].end = pos; }
  for (var i = 0; i < toks.length; i++){
    if (toks[i].type !== 'name' || toks[i].value !== 'eval') continue;
    var j = i + 1;
    while (toks[j] && toks[j].type === 'ws') j++;
    if (!toks[j] || toks[j].value !== '(') continue;
    var open = j, depth = 0;
    for (var k = open; k < toks.length; k++){
      var v = toks[k].type === 'punct' ? toks[k].value : '';
      if (v === '(') depth++;
      else if (v === ')'){
        depth--;
        if (depth === 0){
          return { callStart: toks[i].start, callEnd: toks[k].end,
                   argStart: toks[open].end, argEnd: toks[k].start };
        }
      }
    }
  }
  return null;
}

function unpackOnce(src){
  var hit = findEvalCall(src);
  if (!hit) return null;
  var arg = src.slice(hit.argStart, hit.argEnd);
  if (!PACKER_SIG.test(arg)) return null;        /* only evaluate known packer shapes */
  var result;
  try {
    result = new Function('return (' + arg + ')')();
  } catch (e){
    throw new Error('unpacking failed: ' + e.message);
  }
  if (typeof result !== 'string') return null;
  return src.slice(0, hit.callStart) + result + src.slice(hit.callEnd);
}

function unpackAll(src, maxRounds){
  var rounds = 0;
  for (var i = 0; i < (maxRounds || 12); i++){
    var next = unpackOnce(src);
    if (next === null) break;
    src = next; rounds++;
  }
  return { code: src, rounds: rounds };
}

/* ------------------------------------------------------------------ *
 * Stage 2: String.fromCharCode(...) folding
 * ------------------------------------------------------------------ */
function foldFromCharCode(src){
  var re = /(?:String\s*\.\s*)?fromCharCode\s*\(\s*((?:0[xX][0-9a-fA-F]+|\d+)(?:\s*,\s*(?:0[xX][0-9a-fA-F]+|\d+))*)\s*\)/g;
  var count = 0;
  var out = src.replace(re, function(all, list){
    try {
      var chars = list.split(',').map(function(s){
        s = s.trim();
        return String.fromCharCode(/^0[xX]/.test(s) ? parseInt(s,16) : parseInt(s,10));
      }).join('');
      count++;
      return quote(chars);
    } catch (e){ return all; }
  });
  return { code: out, count: count };
}

/* ------------------------------------------------------------------ *
 * Stage 3: token-level transforms
 * ------------------------------------------------------------------ */
function sig(toks, i, dir){
  i += dir;
  while (toks[i] && (toks[i].type === 'ws' || toks[i].type === 'comment')) i += dir;
  return toks[i] ? i : -1;
}

function decodeEscapes(toks){
  var count = 0;
  for (var i = 0; i < toks.length; i++){
    if (toks[i].type !== 'str') continue;
    if (!/\\(x|u|[0-7])/.test(toks[i].value)) continue;
    var val = parseStringLiteral(toks[i].value);
    if (/[\u0000-\u0008\u000e-\u001f]/.test(val)) continue;   /* leave binary blobs alone */
    toks[i].value = quote(val, toks[i].value[0]);
    count++;
  }
  return count;
}

function foldConcat(toks){
  var count = 0, changed = true;
  while (changed){
    changed = false;
    for (var i = 0; i < toks.length; i++){
      if (toks[i].type !== 'str') continue;
      var p = sig(toks, i, 1);
      if (p < 0 || toks[p].type !== 'punct' || toks[p].value !== '+') continue;
      var q = sig(toks, p, 1);
      if (q < 0 || toks[q].type !== 'str') continue;
      var merged = parseStringLiteral(toks[i].value) + parseStringLiteral(toks[q].value);
      toks[i].value = quote(merged, toks[i].value[0]);
      toks.splice(i + 1, q - i);
      count++; changed = true;
    }
  }
  return count;
}

var RESERVED_DOT = new Set(['class','delete','new','function','var','return','if','else','for',
'while','do','switch','case','default','break','continue','typeof','instanceof','in','void',
'this','null','true','false','try','catch','finally','throw','with','const','let','import',
'export','super','yield','await','enum','extends']);

function bracketToDot(toks){
  var count = 0;
  for (var i = 0; i < toks.length; i++){
    if (!(toks[i].type === 'punct' && toks[i].value === '[')) continue;
    var before = sig(toks, i, -1);
    if (before < 0) continue;
    var b = toks[before];
    var memberish = (b.type === 'name' && !RESERVED_DOT.has(b.value)) ||
                    (b.type === 'punct' && (b.value === ')' || b.value === ']')) ||
                    b.type === 'str' || b.type === 'template';
    if (!memberish) continue;
    var s = sig(toks, i, 1);
    if (s < 0 || toks[s].type !== 'str') continue;
    var e = sig(toks, s, 1);
    if (e < 0 || toks[e].value !== ']') continue;
    var name = parseStringLiteral(toks[s].value);
    if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name) || RESERVED_DOT.has(name)) continue;
    toks.splice(i, e - i + 1, {type:'punct', value:'.'}, {type:'name', value:name});
    count++;
  }
  return count;
}

/* ------------------------------------------------------------------ *
 * Stage 4: beautifier
 * ------------------------------------------------------------------ */
var CTRL_KEYWORDS = new Set(['if','for','while','switch','catch','return','typeof','delete',
'void','new','in','of','do','else','case','throw','await','yield','instanceof']);

function beautify(toks, indentStr){
  var out = [], line = '', indent = 0, lineIndent = 0, started = false,
      suppress = false, stack = [{ch:'', tern:0}];

  function top(){ return stack[stack.length-1]; }
  function repeat(s, n){ var r = ''; for (var i = 0; i < n; i++) r += s; return r; }
  function newline(){
    if (started && line.trim() !== '') out.push(repeat(indentStr, lineIndent) + line.trim());
    line = ''; started = false; suppress = false;
  }
  function add(text, wantSpace){
    if (!started){ lineIndent = Math.max(0, indent); started = true; }
    else if (wantSpace && !suppress && !/\s$/.test(line)) line += ' ';
    line += text;
    suppress = false;
  }
  function blank(){ if (out.length && out[out.length-1] !== '') out.push(''); }

  var s = toks.filter(function(t){ return t.type !== 'ws'; });

  /* index of the bracket matching the one at position i */
  function matchAt(i){
    var open = s[i].value, close = open === '[' ? ']' : (open === '(' ? ')' : '}'), depth = 0;
    for (var k = i; k < s.length; k++){
      if (s[k].type !== 'punct') continue;
      if (s[k].value === open) depth++;
      else if (s[k].value === close){ depth--; if (!depth) return k; }
    }
    return -1;
  }
  /* an array literal is only split across lines when it is long and has items */
  function arrayIsMultiline(i){
    var end = matchAt(i);
    if (end < 0) return false;
    var len = 0, depth = 0, comma = false;
    for (var k = i + 1; k < end; k++){
      len += s[k].value.length + 1;
      if (s[k].type !== 'punct') continue;
      if ('([{'.indexOf(s[k].value) !== -1) depth++;
      else if (')]}'.indexOf(s[k].value) !== -1) depth--;
      else if (s[k].value === ',' && depth === 0) comma = true;
    }
    return comma && len > 72;
  }

  for (var i = 0; i < s.length; i++){
    var t = s[i], next = s[i+1], prev = s[i-1];

    if (t.type === 'comment'){
      if (t.line){ add(t.value, true); newline(); }
      else {
        newline();
        t.value.split('\n').forEach(function(l, idx){
          add(idx ? ' ' + l.trim() : l.trim(), false); newline();
        });
      }
      continue;
    }

    if (t.type !== 'punct'){ add(t.value, true); continue; }

    switch (t.value){
      case '{': {
        if (next && next.type === 'punct' && next.value === '}'){ add('{}', true); i++; break; }
        add('{', true); stack.push({ch:'{', tern:0}); indent++; newline(); break;
      }
      case '}': {
        indent--; newline(); add('}', false);
        if (stack.length > 1) stack.pop();
        var nv = next && next.type === 'punct' ? next.value : null;
        var nk = next && next.type === 'name' ? next.value : null;
        if (nv && [')',']',',',';','.','?',':'].indexOf(nv) !== -1) break;
        if (nk && ['else','catch','finally','while'].indexOf(nk) !== -1) break;
        newline();
        if (nk === 'function' || nk === 'class') blank();
        break;
      }
      case '(': {
        var needSp = !!(prev && prev.type === 'name' && CTRL_KEYWORDS.has(prev.value));
        add('(', needSp); stack.push({ch:'(', tern:0}); suppress = true; break;
      }
      case ')': add(')', false); if (stack.length > 1) stack.pop(); break;
      case '[': {
        var memberish = !!(prev && ((prev.type === 'name' && !CTRL_KEYWORDS.has(prev.value)) ||
                        (prev.type === 'punct' && (prev.value === ')' || prev.value === ']')) ||
                        prev.type === 'str'));
        var multi = arrayIsMultiline(i);
        add('[', !memberish); stack.push({ch:'[', tern:0, multi:multi}); suppress = true;
        if (multi){ indent++; newline(); }
        break;
      }
      case ']': {
        if (top().multi){ indent--; newline(); }
        add(']', false);
        if (stack.length > 1) stack.pop();
        break;
      }
      case ';': {
        add(';', false);
        if (top().ch === '(') line += ' ';
        else {
          newline();
          if (next && next.type === 'name' && (next.value === 'function' || next.value === 'class')) blank();
        }
        break;
      }
      case ',': {
        add(',', false);
        if (top().ch === '{' || (top().ch === '[' && top().multi)) newline(); else line += ' ';
        break;
      }
      case '?': add('?', true); top().tern++; line += ' '; suppress = true; break;
      case ':': {
        if (top().tern > 0){ top().tern--; add(':', true); } else add(':', false);
        line += ' '; suppress = true; break;
      }
      case '.': case '?.': add(t.value, false); suppress = true; break;
      case '!': case '~': add(t.value, true); suppress = true; break;
      case '++': case '--': {
        var postfix = !!(prev && (prev.type === 'name' || prev.type === 'num' ||
                     (prev.type === 'punct' && (prev.value === ')' || prev.value === ']'))));
        add(t.value, !postfix); if (!postfix) suppress = true; break;
      }
      case '+': case '-': {
        var unary = !prev ||
                    (prev.type === 'punct' && [')',']','}','++','--'].indexOf(prev.value) === -1) ||
                    (prev.type === 'name' && PREFIX_KEYWORDS.has(prev.value));
        add(t.value, true);
        if (unary) suppress = true; else { line += ' '; suppress = true; }
        break;
      }
      default:
        add(t.value, true); line += ' '; suppress = true;
    }
  }
  newline();
  return out.join('\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+$/gm, '');
}

function joinTokens(toks){
  return toks.map(function(t){ return t.value; }).join('');
}

/* ------------------------------------------------------------------ *
 * Pipeline
 * ------------------------------------------------------------------ */
function deobfuscate(src, opts){
  opts = opts || {};
  var log = [], code = src, c;

  if (opts.unpack !== false){
    var r = unpackAll(code);
    code = r.code;
    if (r.rounds) log.push('unpacked ' + r.rounds + ' eval layer' + (r.rounds > 1 ? 's' : ''));
  }
  if (opts.charCode !== false){
    var f = foldFromCharCode(code);
    code = f.code;
    if (f.count) log.push('fromCharCode x' + f.count);
  }

  var toks = tokenize(code);
  if (opts.escapes !== false){ c = decodeEscapes(toks); if (c) log.push('escapes x' + c); }
  if (opts.concat  !== false){ c = foldConcat(toks);    if (c) log.push('concat folds x' + c); }
  if (opts.dot     !== false){ c = bracketToDot(toks);  if (c) log.push('bracket-to-dot x' + c); }

  var outCode = opts.beautify === false ? joinTokens(toks) : beautify(toks, opts.indent || '    ');
  return { code: outCode, log: log };
}
//---CORE-END---

/* ------------------------------------------------------------------ *
 * Highlighter (reuses the tokenizer)
 * ------------------------------------------------------------------ */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(code){
  var toks = tokenize(code), out = '';
  for (var i = 0; i < toks.length; i++){
    var t = toks[i], v = esc(t.value), cls = null;
    if (t.type === 'ws'){ out += v; continue; }
    if (t.type === 'comment') cls = 'com';
    else if (t.type === 'str' || t.type === 'template') cls = 'str';
    else if (t.type === 'num') cls = 'num';
    else if (t.type === 'regex') cls = 're';
    else if (t.type === 'name'){
      if (KEYWORDS.has(t.value)) cls = 'kw';
      else {
        var j = i + 1; while (toks[j] && toks[j].type === 'ws') j++;
        if (toks[j] && toks[j].value === '(') cls = 'fn';
      }
    } else cls = 'op';
    out += cls ? '<span class="' + cls + '">' + v + '</span>' : v;
  }
  return out;
}

var $ = function(id){ return document.getElementById(id); };
var input = $('input'), output = $('output').firstElementChild, statusEl = $('status');

function opts(){
  var ind = $('optIndent').value;
  return {
    unpack:   $('optPack').checked,
    escapes:  $('optEsc').checked,
    charCode: $('optCharCode').checked,
    concat:   $('optConcat').checked,
    dot:      $('optDot').checked,
    beautify: $('optBeautify').checked,
    indent:   ind === 'tab' ? '\t' : (ind === '2' ? '  ' : '    ')
  };
}

function setStatus(msg, kind){ statusEl.textContent = msg; statusEl.className = kind || ''; }

function run(){
  var src = input.value;
  $('inStats').textContent = src.length + ' chars';
  if (!src.trim()){
    output.innerHTML = ''; output.dataset.raw = '';
    $('outStats').textContent = ''; setStatus('Nothing to do.'); return;
  }
  var t0 = performance.now();
  try {
    var res = deobfuscate(src, opts());
    output.innerHTML = $('optHl').checked ? highlight(res.code) : esc(res.code);
    output.dataset.raw = res.code;
    $('outStats').textContent = res.code.split('\n').length + ' lines / ' + res.code.length + ' chars';
    var ms = (performance.now() - t0).toFixed(1);
    setStatus('Done in ' + ms + ' ms' +
      (res.log.length ? ' - ' + res.log.join(', ')
                      : ' - no obfuscation patterns matched, formatted only'), 'ok');
  } catch (e){
    setStatus('Error: ' + e.message, 'err');
  }
}

$('btnRun').onclick = run;
$('btnSample').onclick = function(){ input.value = SAMPLE; run(); };
$('btnClear').onclick = function(){
  input.value = ''; output.innerHTML = ''; output.dataset.raw = '';
  $('inStats').textContent = ''; $('outStats').textContent = ''; setStatus('Ready.');
};
$('btnOpen').onclick = function(){ $('file').click(); };
$('file').onchange = function(e){
  var f = e.target.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){ input.value = fr.result; run(); };
  fr.readAsText(f);
};
$('btnCopy').onclick = function(){
  var txt = output.dataset.raw || '';
  if (!navigator.clipboard){ setStatus('Clipboard API unavailable - select the text manually.', 'err'); return; }
  navigator.clipboard.writeText(txt).then(
    function(){ setStatus('Copied ' + txt.length + ' chars.', 'ok'); },
    function(){ setStatus('Clipboard blocked by the browser - select the text manually.', 'err'); });
};
$('btnSave').onclick = function(){
  var blob = new Blob([output.dataset.raw || ''], {type:'text/javascript'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'deobfuscated.js';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};
input.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
});
['optPack','optEsc','optCharCode','optConcat','optDot','optBeautify','optIndent','optHl']
  .forEach(function(id){ $(id).addEventListener('change', function(){ if (input.value.trim()) run(); }); });

  var candidates = ['icon.png','icon.jpg','icon.jpeg','icon.webp','duck.png','icon.svg'],
      i = 0, img = $('logo'), mark = $('mark'), fav = $('favicon');
  function next(){ img.src = (i < candidates.length) ? candidates[i++] : EMBEDDED; }
  img.addEventListener('load', function(){
    if (!img.naturalWidth) return next();
    mark.classList.add('has-img');
    mark.title = 'Your icon - drag another image here to replace, Alt+click to reset';
    if (fav) fav.href = img.src;
  });
  img.addEventListener('error', next);

  /* a previously dropped icon wins over files on disk */
  var stored = null;
  try { stored = localStorage.getItem('jsdeob.icon'); } catch (e){}
  if (stored) img.src = stored; else next();

  /* drag an image onto the badge to set it */
  ['dragenter','dragover'].forEach(function(ev){
    mark.addEventListener(ev, function(e){ e.preventDefault(); mark.style.opacity = '.65'; });
  });
  ['dragleave','drop'].forEach(function(ev){
    mark.addEventListener(ev, function(){ mark.style.opacity = ''; });
  });
  mark.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f || !/^image\//.test(f.type)) return;
    var fr = new FileReader();
    fr.onload = function(){
      img.src = fr.result;
      try { localStorage.setItem('jsdeob.icon', fr.result); }
      catch (err){
        setStatus('Icon set for this session only - ' +
          (/quota/i.test(err.name || '') ? 'image too large to store.'
                                         : 'browser storage unavailable. Save it as icon.png instead.'), 'ok');
      }
    };
    fr.readAsDataURL(f);
  });
  mark.addEventListener('click', function(e){
    if (!e.altKey) return;
    try { localStorage.removeItem('jsdeob.icon'); } catch (err){}
    mark.classList.remove('has-img');
    i = 0; next();
  });
})();

/* ---- resizable split: growing one pane shrinks the other ---- */
(function(){
  var main = document.querySelector('main'), split = $('split'),
      paneIn = $('paneIn'), paneOut = $('paneOut'), fraction = 0.5;

  function isVertical(){ return window.matchMedia('(max-width:900px)').matches; }
  function apply(f){
    fraction = Math.min(0.9, Math.max(0.1, f));
    paneIn.style.flex  = fraction + ' 1 0';
    paneOut.style.flex = (1 - fraction) + ' 1 0';
    try { localStorage.setItem('jsdeob.split', String(fraction)); } catch (e){}
  }

  try {
    var saved = parseFloat(localStorage.getItem('jsdeob.split'));
    if (saved > 0 && saved < 1) fraction = saved;
  } catch (e){}
  apply(fraction);

  var dragging = false;

  split.addEventListener('pointerdown', function(e){
    e.preventDefault();
    dragging = true;
    try { split.setPointerCapture(e.pointerId); } catch (err){}
    document.body.classList.add('dragging');
    if (isVertical()) document.body.classList.add('vert');
  });
  function move(e){
    if (!dragging) return;
    var r = main.getBoundingClientRect();
    apply(isVertical() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width);
  }
  function end(){
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging', 'vert');
  }
  split.addEventListener('pointermove', move);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  split.addEventListener('dblclick', function(){ apply(0.5); });

  /* keyboard nudge for accessibility */
  split.tabIndex = 0;
  split.addEventListener('keydown', function(e){
    var back = isVertical() ? 'ArrowUp' : 'ArrowLeft', fwd = isVertical() ? 'ArrowDown' : 'ArrowRight';
    if (e.key === back){ apply(fraction - 0.05); e.preventDefault(); }
    else if (e.key === fwd){ apply(fraction + 0.05); e.preventDefault(); }
  });
})();
